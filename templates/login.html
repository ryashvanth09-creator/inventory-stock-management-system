<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Inventory Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;

            margin-top: 8px;
            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #94a3b8;
            font-size: 13px;
        }
    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">📦</div>

    <h1>Inventory Management</h1>

    <p class="subtitle">
        Login to manage your stock
    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="error-message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="footer">
        Inventory & Stock Management System
    </div>

</div>

</body>
</html>
