<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if category %}
            Edit Category
        {% else %}
            Add Category
        {% endif %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 550px;
        }

        .form-box {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;

            color: #334155;

            font-weight: bold;

            margin-bottom: 8px;
            margin-top: 20px;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;

            border-color: #2563eb;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .save-btn {
            background: #2563eb;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 6px;

            font-size: 15px;

            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e2e8f0;

            color: #334155;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 6px;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        .message {
            padding: 12px;

            background: #fee2e2;

            color: #b91c1c;

            border-radius: 6px;

            margin-bottom: 20px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="form-box">


        <div class="icon">
            🗂
        </div>


        {% if category %}

            <h1>Edit Category</h1>

            <p class="subtitle">
                Update category information
            </p>

        {% else %}

            <h1>Add Category</h1>

            <p class="subtitle">
                Create a new product category
            </p>

        {% endif %}



        <!-- Messages -->

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}



        <!-- Form -->

        <form method="POST">

            {% csrf_token %}


            <!-- Category Name -->

            <label>
                Category Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ category.name|default:'' }}"
                placeholder="Example: Electronics"
                required
            >



            <!-- Description -->

            <label>
                Description
            </label>

            <textarea
                name="description"
                placeholder="Enter category description"
            >{{ category.description|default:'' }}</textarea>



            <!-- Buttons -->

            <div class="buttons">


                <button
                    type="submit"
                    class="save-btn">

                    {% if category %}

                        Update Category

                    {% else %}

                        Save Category

                    {% endif %}

                </button>


                <a
                    href="{% url 'category_list' %}"
                    class="cancel-btn">

                    Cancel

                </a>


            </div>


        </form>


    </div>

</div>


</body>

</html>
