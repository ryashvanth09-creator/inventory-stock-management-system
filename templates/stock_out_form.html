<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Stock - Inventory System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-box {
            width: 550px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        select,
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .required {
            color: red;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .info {
            background: #fff7ed;
            color: #9a3412;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 14px;
        }

        .buttons {
            margin-top: 25px;
        }

        .issue-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .issue-btn:hover {
            background: #b91c1c;
        }

        .cancel-btn {
            display: inline-block;
            background: #e2e8f0;
            color: #334155;
            padding: 12px 20px;
            margin-left: 8px;
            border-radius: 6px;
            text-decoration: none;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }
    </style>

</head>

<body>

<div class="form-box">

    <h2>📤 Issue Stock</h2>

    <div class="subtitle">
        Issue products to a customer
    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Product <span class="required">*</span>
        </label>

        <select name="product" required>

            <option value="">
                -- Select Product --
            </option>

            {% for product in products %}

                <option value="{{ product.id }}">
                    {{ product.name }}
                    - {{ product.sku }}
                    - Available: {{ product.quantity }}
                </option>

            {% endfor %}

        </select>


        <label>
            Customer <span class="required">*</span>
        </label>

        <select name="customer" required>

            <option value="">
                -- Select Customer --
            </option>

            {% for customer in customers %}

                <option value="{{ customer.id }}">
                    {{ customer.name }} - {{ customer.phone }}
                </option>

            {% endfor %}

        </select>


        <label>
            Quantity to Issue <span class="required">*</span>
        </label>

        <input
            type="number"
            name="quantity"
            min="1"
            placeholder="Enter quantity"
            required
        >


        <div class="info">
            ⚠️ The quantity entered here will automatically be subtracted from the product stock.
        </div>


        <div class="buttons">

            <button
                type="submit"
                class="issue-btn">
                Issue Stock
            </button>

            <a
                href="{% url 'stock_out_list' %}"
                class="cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
